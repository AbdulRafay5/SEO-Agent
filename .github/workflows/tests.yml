name: Python checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q app.py github_store.py keywords.py keyword_research.py tests
      - run: python -c "from app import app; from flask import Flask; assert isinstance(app, Flask)"
      - run: python -m unittest discover -s tests

      - run: python rag_evaluation.py
